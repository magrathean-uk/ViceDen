boards_file = "config/boards.toml"

[server]
bind = "127.0.0.1:3000"
max_request_body_bytes = 131072
request_timeout_seconds = 15
secure_cookies = false

[database]
url = "postgres://viceden:change-me@127.0.0.1:5432/viceden"
require_connection = false
max_connections = 10

[auth]
founder_password = ""
token_pepper = ""

[server.proxy]
trusted_cidrs = ["127.0.0.1/32", "::1/128"]
client_ip_headers = ["Cf-Connecting-Ip", "X-Forwarded-For"]

[server.rate_limit]
disabled = false

[classifier]
provider = "anthropic"
model = "claude-haiku-4-5-20251001"
api_key_env = "ANTHROPIC_API_KEY"
sync_deadline_ms = 1500
worker_interval_s = 30
worker_max_inflight = 4
worker_max_retries = 10
audit_sample_size = 50
audit_lookback_days = 7
